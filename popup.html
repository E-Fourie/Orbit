<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spaces</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Spaces</h1>
    <div class="hdr">
      <button id="copyLink" class="icon" title="Copy current tab link">🔗</button>
      <button id="popout" class="icon" title="Open as a floating window (side-panel style)">⧉</button>
    </div>
  </header>

  <div id="toast" hidden></div>
  <main id="list"></main>

  <div class="addrow">
    <button id="add" class="add">＋ New space</button>
  </div>

  <form id="folderEditor" hidden>
    <h2 id="fdTitle">New folder</h2>
    <div class="field"><input id="fdName" placeholder="Folder name" required maxlength="40" aria-label="Folder name"></div>
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="fdCancel">Cancel</button>
    </div>
    <div id="fdDanger" class="danger" hidden>
      <button type="button" id="fdDelete">Delete folder (keeps its tabs)</button>
    </div>
  </form>

  <form id="editor" hidden>
    <h2 id="edTitle">New space</h2>
    <div class="field">
      <input id="edEmoji" maxlength="8" class="emoji-in" aria-label="Emoji">
      <input id="edName" placeholder="Space name" required maxlength="40" aria-label="Name">
    </div>
    <div id="swatches" class="swatches"></div>
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="edCancel">Cancel</button>
    </div>
    <div id="edDanger" class="danger" hidden>
      <button type="button" id="edDelKeep">Delete (keep tabs)</button>
      <button type="button" id="edDelClose">Delete &amp; close tabs</button>
    </div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
